<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FacadeProbe · 建筑立面视觉场景</title>
<style>
:root{color-scheme:light;--ink:#213948;--muted:#566d7c;--line:#cedae2;--blue:#226a99;--bg:#edf2f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}button,select,input{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #267caf;outline-offset:4px}header{max-width:1440px;margin:auto;display:flex;gap:20px;align-items:center;justify-content:space-between;padding:28px 32px 20px}.brand{font-weight:750;font-size:27px;letter-spacing:-.5px}header p{margin:0;color:var(--muted);font-size:13px}.version{border:1px solid var(--line);padding:5px 10px;background:white;border-radius:4px;font-size:12px}main{max-width:1440px;margin:auto;padding:0 32px 32px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;gap:20px}h1{font-size:23px;line-height:1.4;margin:0 0 4px;font-weight:650}.intro p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 278px;gap:22px;align-items:start}.workspace{min-width:0}.controls{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:14px}.group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.group-label{color:var(--muted);font-size:12px;margin-right:5px}.choice{padding:7px 12px;border:1px solid var(--line);background:white;border-radius:5px;color:var(--ink);font-size:13px;min-height:36px}.choice[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}.choice:hover{border-color:var(--blue)}.stage{background:#dfe8ee;border:1px solid #bccdd9;border-radius:5px;overflow:hidden;position:relative;aspect-ratio:4/3}.stage img{display:block;width:100%;height:100%;object-fit:contain}.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.stage svg rect{fill:rgba(255,255,255,.035);stroke:#ffdc7e;stroke-width:2.4;vector-effect:non-scaling-stroke}.stage svg rect.selected{stroke:#ff8d68;stroke-width:3.3}.stage svg text{font:17px Consolas,monospace;fill:#fff;paint-order:stroke;stroke:#213948;stroke-width:3}.image-footer{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:10px 0 16px;color:var(--muted);font-size:12px}.image-footer label{display:flex;align-items:center;gap:7px;cursor:pointer}.image-footer input{accent-color:var(--blue)}.legend{display:flex;flex-wrap:wrap;gap:7px 16px;font-size:11px;color:var(--muted)}.legend-item{display:inline-flex;gap:6px;align-items:center}.legend i{width:11px;height:11px;border-radius:2px;display:block}.rail{background:white;border:1px solid var(--line);border-radius:5px;padding:19px}.rail h2{font-size:16px;margin:0 0 15px}.rail label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.rail select{width:100%;padding:8px;border:1px solid #b3c5d1;background:white;color:var(--ink);border-radius:4px;font-size:13px}.facts{margin:14px 0 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}.facts dt{font-size:11px;color:var(--muted)}.facts dd{margin:0;font-size:23px;font-weight:650;font-variant-numeric:tabular-nums}.facts .wide{grid-column:1/-1}.facts .wide dd{font-size:13px;font-weight:500;overflow-wrap:anywhere}.visibility{padding:11px 12px;background:#eef5f9;border-left:3px solid #4d819e;font-size:12px;min-height:60px;margin-bottom:20px}.rail details{border-top:1px solid var(--line);padding:13px 0 0;margin-top:13px}.rail summary{cursor:pointer;font-size:13px;font-weight:600}.rail pre{font:11px/1.65 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}.downloads{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:16px}.downloads a{color:var(--blue);font-size:12px;text-decoration:none}.downloads a:hover{text-decoration:underline}.limitations{margin:24px 0 0;padding-top:17px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);max-width:110ch}.counts{font-size:12px;white-space:nowrap;color:var(--muted)}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 235px}.rail{padding:15px}header,main{padding-left:22px;padding-right:22px}.choice{padding:7px 9px;font-size:12px}.controls{gap:10px}}
@media(max-width:720px){header{padding:20px 16px 16px}.brand{font-size:24px}header p{font-size:11px}.version{font-size:10px}main{padding:0 14px 24px}.intro{display:block;margin-bottom:16px}h1{font-size:20px}.intro p{font-size:12px}.counts{display:block;margin-top:8px}.layout{grid-template-columns:1fr;gap:18px}.controls{display:block}.group{margin-bottom:9px;gap:6px}.group-label{width:34px;font-size:11px}.choice{padding:7px 10px;font-size:11px;min-height:34px}.image-footer{font-size:10px;gap:8px}.legend{font-size:10px;gap:6px 13px}.rail{padding:18px}.facts{grid-template-columns:1fr 1fr 1fr}.facts .wide{grid-column:auto}.facts dd{font-size:21px}.facts .wide dd{font-size:12px}.downloads{grid-template-columns:1fr 1fr;gap:13px}.limitations{font-size:11px}.stage svg text{font-size:20px}}
</style></head>
<body><header><div><div class="brand">FacadeProbe</div><p>建筑立面视觉场景</p></div><span class="version">v0.1.0 · MIT</span></header>
<main><section class="intro"><div><h1>同一栋建筑，查看遮挡前后的标签</h1><p>1 栋原创建筑，3 种状态，4 个固定视角。</p></div><span class="counts" id="frame-count"></span></section>
<div class="layout"><section class="workspace"><div class="controls"><div class="group" aria-label="建筑状态"><span class="group-label">状态</span><button class="choice" data-case="clean" aria-pressed="true">无遮挡</button><button class="choice" data-case="balcony" aria-pressed="false">阳台遮挡</button><button class="choice" data-case="screen" aria-pressed="false">前景格栅</button></div><div class="group" aria-label="相机视角"><span class="group-label">视角</span><button class="choice" data-view="front" aria-pressed="true">正面</button><button class="choice" data-view="left" aria-pressed="false">左斜视</button><button class="choice" data-view="right" aria-pressed="false">右斜视</button><button class="choice" data-view="high" aria-pressed="false">高机位</button></div></div>
<div class="controls"><div class="group" aria-label="图像通道"><button class="choice" data-mode="rgb" aria-pressed="true">RGB</button><button class="choice" data-mode="semantic-color" aria-pressed="false">语义</button><button class="choice" data-mode="overlay" aria-pressed="false">叠加</button><button class="choice" data-mode="depth-preview" aria-pressed="false">深度</button></div></div>
<div class="stage"><img id="render" alt="建筑立面真实渲染"><svg id="boxes" aria-hidden="true"></svg></div><div class="image-footer"><span id="image-name"></span><label><input id="show-boxes" type="checkbox">可见门窗框</label></div><div class="legend">__LEGEND__</div></section>
<aside class="rail"><h2>门窗实例</h2><label for="instance">选择实例</label><select id="instance"></select><dl class="facts"><div><dt>可见窗户</dt><dd id="window-count"></dd></div><div><dt>可见像素</dt><dd id="pixel-count"></dd></div><div class="wide"><dt>可见边界框 xywh</dt><dd id="bbox"></dd></div></dl><p class="visibility" id="visibility"></p><div class="downloads"><a id="blend" download>源场景 .blend</a><a id="glb" download>通用模型 .glb</a><a id="camera-json">相机 JSON</a><a id="labels-json">可见标签 JSON</a><a href="validation.json">验证结果 JSON</a></div><details><summary>相机内参与坐标</summary><pre id="camera-details"></pre></details></aside></div>
<p class="limitations">小型合成测试资源，用于建筑 CV 的标签、遮挡与投影检查。遮罩只标记可见表面；窗面采用不透明材质。深度为相机 Z（米），背景为 NaN。数据不代表真实建筑分布、工程 BIM 或模型识别精度。</p>
</main><script>
const DATA=__DATA__;
const state={case:"clean",view:"front",mode:"rgb",instance:101};
const names={clean:"无遮挡",balcony:"阳台遮挡",screen:"前景格栅",front:"正面",left:"左斜视",right:"右斜视",high:"高机位",rgb:"RGB","semantic-color":"语义",overlay:"叠加","depth-preview":"深度"};
const svgNS="http://www.w3.org/2000/svg";
function frame(){return DATA.frames[state.case+"/"+state.view];}
function update(){
 const current=frame(),items=current.annotations.instances.filter(x=>x.category_id===2||x.category_id===3);
 for(const key of ["case","view","mode"])for(const button of document.querySelectorAll("[data-"+key+"]"))button.setAttribute("aria-pressed",String(button.dataset[key]===state[key]));
 const image=document.querySelector("#render");image.src=current.path+"/"+state.mode+".png";image.alt=names[state.case]+" · "+names[state.view]+" · "+names[state.mode];
 document.querySelector("#image-name").textContent=image.alt+" · "+current.camera.width+" × "+current.camera.height;
 document.querySelector("#frame-count").textContent=DATA.manifest.views.length+" 视图 · 相机参数与像素标签";
 const select=document.querySelector("#instance");select.replaceChildren();
 for(const item of items){const option=document.createElement("option");option.value=item.instance_id;option.textContent=(item.category_id===2?"窗户 ":"门 ")+item.instance_id+(item.visible?"":" · 不可见");select.append(option);}
 select.value=String(state.instance);
 const selected=items.find(x=>x.instance_id===state.instance);
 document.querySelector("#window-count").textContent=items.filter(x=>x.category_id===2&&x.visible).length+" / 8";
 document.querySelector("#pixel-count").textContent=selected.visible_pixels.toLocaleString();
 document.querySelector("#bbox").textContent=selected.visible_bbox_xywh?selected.visible_bbox_xywh.join(", "):"无可见像素";
 const pair=DATA.validation.paired_visibility.find(x=>x.case===state.case&&x.view===state.view&&x.instance_id===state.instance);
 document.querySelector("#visibility").textContent=pair&&pair.hidden_fraction_of_clean_visible_pixels!==null?"相对同机位无遮挡视图，可见像素减少 "+(pair.hidden_fraction_of_clean_visible_pixels*100).toFixed(1)+"%。":"当前为无遮挡参考视图，像素数来自实际实例遮罩。";
 document.querySelector("#blend").href="scenes/"+state.case+".blend";document.querySelector("#glb").href="scenes/"+state.case+".glb";
 document.querySelector("#camera-json").href=current.path+"/camera.json";document.querySelector("#labels-json").href=current.path+"/annotations.json";
 document.querySelector("#camera-details").textContent="K =\n"+current.camera.K.map(row=>row.map(x=>Number(x).toFixed(3)).join("  ")).join("\n")+"\n\nOpenCV: X右 / Y下 / Z前\n单位：米\n像素中心：(x+0.5, y+0.5)\n畸变：0";
 const boxes=document.querySelector("#boxes");boxes.setAttribute("viewBox","0 0 "+current.camera.width+" "+current.camera.height);boxes.replaceChildren();
 if(document.querySelector("#show-boxes").checked)for(const item of items){if(!item.visible_bbox_xywh)continue;const [x,y,w,h]=item.visible_bbox_xywh;const box=document.createElementNS(svgNS,"rect");for(const [key,val] of Object.entries({x,y,width:w,height:h}))box.setAttribute(key,val);if(item.instance_id===state.instance)box.classList.add("selected");boxes.append(box);const text=document.createElementNS(svgNS,"text");text.setAttribute("x",x+3);text.setAttribute("y",y+18);text.textContent=item.instance_id;boxes.append(text);}
}
for(const key of ["case","view","mode"])for(const button of document.querySelectorAll("[data-"+key+"]"))button.addEventListener("click",()=>{state[key]=button.dataset[key];update();});
document.querySelector("#instance").addEventListener("change",event=>{state.instance=Number(event.target.value);update();});document.querySelector("#show-boxes").addEventListener("change",update);update();
</script></body></html>
